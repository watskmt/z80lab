services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: z80lab-backend
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    networks:
      - z80lab-network

networks:
  z80lab-network:
    driver: bridge
