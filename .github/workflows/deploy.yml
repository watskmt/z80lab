name: Build and Deploy to XREA

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://z80lab.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Node.js のセットアップ (Frontend)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 2. Frontend 依存関係のインストールとビルド
      - name: Install and Build (Frontend)
        run: |
          npm install
          echo "VITE_API_URL=https://z80lab.com" > .env
          npm run build

      # 3. PHP のセットアップ (Backend)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, mysql, sqlite
          coverage: none

      # 4. Backend 依存関係のインストール
      - name: Install Dependencies (Backend)
        working-directory: ./backend
        run: |
          composer install --no-dev --optimize-autoloader

      # 5. Production .env の作成 (Backend)
      - name: Create Production .env (Backend)
        working-directory: ./backend
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=local/APP_ENV=production/g' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/g' .env
          sed -i 's|APP_URL=http://localhost|APP_URL=https://z80lab.com|g' .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      # 6. lftp のインストール
      - name: Install lftp
        run: sudo apt-get install -y lftp

      # 6. FTP デプロイ
      - name: FTP Deploy
        run: |
          # 修正版 index.php の作成 (public_html/api 用)
          mkdir -p api-dist
          cp backend/public/index.php api-dist/index.php
          sed -i "s|__DIR__.'/../|__DIR__.'/../../laravel/|g" api-dist/index.php
          cp backend/public/.htaccess api-dist/.htaccess

          lftp <<EOF
          set ftp:ssl-allow yes;
          open -u ${{ secrets.XREA_USER }},${{ secrets.XREA_PASS }} ${{ secrets.XREA_HOST }};
          # Frontend のデプロイ
          mirror -R ./dist/ ~/domains/z80lab.com/public_html --delete --parallel=10 --exclude .git/;
          # API エントリポイントのデプロイ (public_html/apiへ)
          mkdir -p ~/domains/z80lab.com/public_html/api;
          mirror -R ./api-dist/ ~/domains/z80lab.com/public_html/api --delete;
          # Backend のデプロイ (Laravel本体をpublic_htmlの外に配置)
          mkdir -p ~/domains/z80lab.com/laravel;
          mirror -R ./backend/ ~/domains/z80lab.com/laravel --delete --parallel=10 --exclude .git/ --exclude vendor/ --exclude storage/logs/ --exclude storage/framework/sessions/;
          # vendor ディレクトリのみ別途同期 (変更が多いため削除せずに同期)
          mirror -R ./backend/vendor/ ~/domains/z80lab.com/laravel/vendor --parallel=10;
          quit
          EOF

      - name: Show Deployment URL
        run: echo "Deployed to https://z80lab.com"