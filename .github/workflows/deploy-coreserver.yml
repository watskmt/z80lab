name: Build and Deploy to CoreServer V2

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production-coreserver
      url: https://z80lab.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Node.js のセットアップ (Frontend)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 2. Frontend 依存関係のインストールとビルド
      - name: Install and Build (Frontend)
        run: |
          npm install
          echo "VITE_API_URL=https://z80lab.com" > .env
          npm run build

      # 3. PHP のセットアップ (Backend)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, mysql, sqlite
          coverage: none

      # 4. Backend 依存関係のインストール
      - name: Install Dependencies (Backend)
        working-directory: ./backend
        run: |
          composer install --no-dev --optimize-autoloader

      # 5. Production .env の作成 (Backend)
      - name: Create Production .env (Backend)
        working-directory: ./backend
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=local/APP_ENV=production/g' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/g' .env
          sed -i 's|APP_URL=http://localhost|APP_URL=https://z80lab.com|g' .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      # 6. lftp のインストール
      - name: Install lftp
        run: sudo apt-get install -y lftp

      # 7. FTP デプロイ (CoreServer V2)
      - name: FTP Deploy
        run: |
          # 修正版 index.php の作成 (public_html/api 用)
          mkdir -p api-dist
          cp backend/public/index.php api-dist/index.php
          sed -i "s|__DIR__.'/../|__DIR__.'/../../laravel/|g" api-dist/index.php
          
          # CoreServer V2 / XREA (PHP engine is disable) 対策用の .htaccess 作成
          # LiteSpeed (CoreServer V2) では .php のハンドラを明示的に設定する必要がある場合がある
          echo "Options +ExecCGI +FollowSymLinks" > api-dist/.htaccess
          echo "AddType application/x-httpd-php84 .php" >> api-dist/.htaccess
          echo "RewriteEngine On" >> api-dist/.htaccess
          echo "RewriteBase /api/" >> api-dist/.htaccess
          echo "RewriteCond %{HTTP:Authorization} ." >> api-dist/.htaccess
          echo "RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]" >> api-dist/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-d" >> api-dist/.htaccess
          echo "RewriteCond %{REQUEST_URI} (.+)/$" >> api-dist/.htaccess
          echo "RewriteRule ^ %1 [L,R=301]" >> api-dist/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-d" >> api-dist/.htaccess
          echo "RewriteCond %{REQUEST_FILENAME} !-f" >> api-dist/.htaccess
          echo "RewriteRule ^ index.php [L]" >> api-dist/.htaccess

          # 診断用 test.php の作成
          echo "<?php header('Content-Type: application/json'); echo json_encode(['status' => 'ok', 'php_version' => PHP_VERSION, 'sapi' => PHP_SAPI]); ?>" > api-dist/test.php

          lftp <<EOF
          set ftp:ssl-allow yes;
          open -u ${{ secrets.CORESERVER_USER }},${{ secrets.CORESERVER_PASS }} ${{ secrets.CORESERVER_HOST }};
          # Frontend のデプロイ (public_htmlへ)
          mirror -R ./dist/ domains/z80lab.com/public_html --delete --parallel=10 --exclude .git/;
          # API エントリポイントのデプロイ (public_html/apiへ)
          set net:max-retries 1;
          mirror -R ./api-dist/ domains/z80lab.com/public_html/api --delete;
          # Backend のデプロイ (public_html の外、~/laravel へ配置)
          mirror -R ./backend/ domains/z80lab.com/laravel --delete --parallel=10 --exclude .git/ --exclude vendor/ --exclude storage/logs/ --exclude storage/framework/sessions/;
          # vendor ディレクトリのみ別途同期 (変更が多いため削除せずに同期)
          mirror -R ./backend/vendor/ domains/z80lab.com/laravel/vendor --parallel=10;
          quit
          EOF

      - name: Show Deployment URL
        run: echo "Deployed to https://z80lab.com"
