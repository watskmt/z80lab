name: Build and Deploy to CoreServer V2

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, mysql, sqlite
          coverage: none

      - name: Install PHP Dependencies
        working-directory: ./backend
        run: composer install --optimize-autoloader

      - name: Install Frontend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Vitest
        working-directory: ./backend
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
        run: npm test

      - name: Run PHPUnit
        working-directory: ./backend
        run: php artisan test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production-coreserver
      url: https://z80lab.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Node.js のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 2. PHP のセットアップ
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, mysql, sqlite
          coverage: none

      # 3. Backend (Laravel) 依存関係のインストール
      - name: Install PHP Dependencies
        working-directory: ./backend
        run: composer install --no-dev --optimize-autoloader

      # 4. Frontend 依存関係のインストールとビルド (Vite)
      - name: Install and Build Frontend
        working-directory: ./backend
        run: |
          npm install
          npm run build

      # 5. Production .env の作成
      - name: Create Production .env
        working-directory: ./backend
        run: |
          cp .env.example .env
          sed -i 's/APP_ENV=local/APP_ENV=production/g' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=false/g' .env
          sed -i 's|APP_URL=http://localhost|APP_URL=https://z80lab.com|g' .env
          echo "ASSET_URL=https://z80lab.com" >> .env
          echo "APP_KEY=${{ secrets.APP_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      # 6. lftp のインストール
      - name: Install lftp
        run: sudo apt-get install -y lftp

      # 7. FTP デプロイ
      - name: FTP Deploy
        run: |
          # サーバー側の public_html/index.php を修正して、正しいパスで laravel/ を読み込むようにする
          # 元の require __DIR__.'/../vendor/autoload.php'; を ../laravel/vendor/autoload.php に書き換え
          # $app = require_once __DIR__.'/../bootstrap/app.php'; を ../laravel/bootstrap/app.php に書き換え
          sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/../laravel/vendor/autoload.php'|g" backend/public/index.php
          sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/../laravel/bootstrap/app.php'|g" backend/public/index.php

          # public_html/.htaccess の Options -Indexes 等が 403 の原因になる場合があるため調整
          # また、CoreServer V2 で PHP が動作するようにハンドラを追加
          sed -i 's/Options -MultiViews -Indexes/Options +FollowSymLinks/g' backend/public/.htaccess
          # PHP 8.4 ハンドラを先頭に追加 (LiteSpeed / CoreServer V2 用)
          # AddHandler と SetHandler の両方を試す
          sed -i '1i <FilesMatch \\.php$>\n  SetHandler application/x-httpd-php84\n</FilesMatch>' backend/public/.htaccess
          sed -i '1i AddHandler application/x-httpd-php84 .php' backend/public/.htaccess

          # 診断用 test.php の作成 (public/ に作成し、public_html/ にデプロイされる)
          echo "<?php header('Content-Type: application/json'); echo json_encode(['status' => 'ok', 'php_version' => PHP_VERSION, 'sapi' => PHP_SAPI]); ?>" > backend/public/test.php

          # database.sqlite が存在しない場合のみ作成するために、一時的なディレクトリを利用
          mkdir -p temp_db
          touch temp_db/database.sqlite

          lftp <<EOF
          set ftp:ssl-allow yes;
          open -u ${{ secrets.CORESERVER_USER }},${{ secrets.CORESERVER_PASS }} ${{ secrets.CORESERVER_HOST }};
          
          # Backend 本体を domains/z80lab.com/laravel にデプロイ (DBファイルは除外)
          mirror -R ./backend/ domains/z80lab.com/laravel --delete --parallel=10 \
            --exclude .git/ \
            --exclude node_modules/ \
            --exclude storage/logs/ \
            --exclude storage/framework/sessions/ \
            --exclude storage/framework/views/ \
            --exclude storage/framework/cache/ \
            --exclude public/build/ \
            --exclude public/assets/ \
            --exclude public/index.php \
            --exclude public/.htaccess \
            --exclude database/database.sqlite;

          # database ディレクトリを同期 (migrations等は同期するが、sqliteファイルは除外して保護)
          mirror -R ./backend/database/ domains/z80lab.com/laravel/database --parallel=10 \
            --exclude database.sqlite;

          # サーバー側に database.sqlite が存在しない場合のみ、空のファイルをアップロード
          mirror -R ./temp_db/ domains/z80lab.com/laravel/database --only-missing --parallel=10;

          # storage ディレクトリの構造を確保 (中のファイルは同期しないがディレクトリは作成)
          # 注意: lftp の mirror はデフォルトでディレクトリを作成する
          # ここでは最小限の構造を同期
          mkdir -p domains/z80lab.com/laravel/storage/framework/sessions || true
          mkdir -p domains/z80lab.com/laravel/storage/framework/views || true
          mkdir -p domains/z80lab.com/laravel/storage/framework/cache || true
          mkdir -p domains/z80lab.com/laravel/storage/logs || true

          # public ディレクトリの中身を domains/z80lab.com/public_html にデプロイ
          mirror -R ./backend/public/ domains/z80lab.com/public_html --delete --parallel=10;

          # manifest.json 等が含まれる build ディレクトリを laravel/public/build にもデプロイ
          # Laravel 11 の Vite は public_path('build/manifest.json') を参照するため、ここにも必要
          mirror -R ./backend/public/build/ domains/z80lab.com/laravel/public/build --delete --parallel=10;

          # vendor は削除せずに同期 (高速化)
          mirror -R ./backend/vendor/ domains/z80lab.com/laravel/vendor --parallel=10;
          
          quit
          EOF

      - name: Show Deployment URL
        run: echo "Deployed to https://z80lab.com"
